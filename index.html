<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无名树 · 产品原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F7C55'/%3E%3Ccircle cx='23' cy='9' r='4' fill='%23F2C14E'/%3E%3Cpath d='M4 24c6-4 10-3 12-6 2 3 6 5 12 6' stroke='%23FBFAF5' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
:root{
  --paper:#FBFAF5;--card:#FFFFFF;
  --ink:#22302A;--ink-2:#5C6A61;--ink-3:#9AA69D;
  --line:#ECE6D8;--line-2:#F4F0E4;
  --green:#4F7C55;--green-2:#3B6042;--green-soft:#E7F1E2;
  --yellow:#E8B03F;--yellow-soft:#FBEFCF;
  --blue:#6FA8C7;--blue-soft:#E5F0F6;
  --red:#D2705E;--red-soft:#F9E4DE;
  --violet:#A98BB5;--violet-soft:#EFE7F2;
  --round:"Yuanti SC","YouYuan","STYuanti","PingFang SC","Microsoft YaHei",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --sh:0 1px 2px rgba(34,48,42,.05),0 10px 22px -14px rgba(34,48,42,.3);
  --sh-s:0 1px 3px rgba(34,48,42,.07);
}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#EDEBE1;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
*:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ---------- 桌面外壳 ---------- */
.shell{min-height:100vh;display:flex;gap:56px;align-items:flex-start;justify-content:center;padding:34px 40px}
.guide{width:248px;flex:0 0 248px;padding-top:4px}
.gm{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gmsvg{color:var(--green);display:flex}
.gm h1{font-family:var(--round);font-size:19px;font-weight:400;letter-spacing:.06em;margin:0}
.gcap{font-size:10.5px;letter-spacing:.08em;color:#8B9389;margin:0 0 28px 32px}
.gl{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid #DAD5C8;padding:13px 0;cursor:pointer;font-size:13px;color:#3A453E;transition:color .18s}
.gl b{font-weight:400;font-family:var(--round)}
.gl span{font-size:10.5px;color:#8B9389;letter-spacing:.03em}
.gl:hover{color:var(--green)}
.gnote{font-size:11px;line-height:1.9;color:#7E877F;margin-top:26px;border-top:1px solid #DAD5C8;padding-top:16px}

/* ---------- 设备 ---------- */
.device{position:relative;width:390px;flex:0 0 390px;height:min(844px,calc(100vh - 68px));background:var(--paper);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(34,48,42,.08),0 30px 70px -16px rgba(34,48,42,.3)}
.sbar{height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:10.5px;letter-spacing:.03em;color:var(--ink-2);background:var(--paper)}
.sbar .sg{display:flex;gap:4px;align-items:center;color:var(--ink-3)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0}
.dockwrap{flex:0 0 auto;background:var(--paper)}

/* ---------- 顶部 ---------- */
.hd{height:56px;display:flex;align-items:center;gap:4px;padding:0 14px;position:sticky;top:0;background:var(--paper);z-index:20}
.hd .bk{width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;background:#fff;border:0;cursor:pointer;color:var(--ink);border-radius:50%;box-shadow:var(--sh-s)}
.hd .tt{font-family:var(--round);font-size:17px;letter-spacing:.03em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.hd .rt{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.hd .rt button{width:38px;height:38px;background:#fff;border:0;cursor:pointer;color:var(--green);display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:var(--sh-s);padding:0}

/* ---------- 通用 ---------- */
.pad{padding:0 20px}
.cd{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px}
.sec-h{font-family:var(--round);font-size:13.5px;color:var(--ink);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.sec-h::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 7px}
.rise{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.btn{border:0;font-size:15px;font-weight:500;height:48px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;transition:transform .12s,background .18s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--green);color:#fff;width:100%}
.btn.primary:active{background:var(--green-2)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);width:100%}
.btn.text{background:none;color:var(--ink-2);font-size:12.5px;height:auto;padding:8px 6px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 9px;border-radius:999px;line-height:1.55;white-space:nowrap;font-weight:500}
.pill.green{background:var(--green-soft);color:var(--green-2)}
.pill.yellow{background:var(--yellow-soft);color:#8A6420}
.pill.blue{background:var(--blue-soft);color:#336A86}
.pill.red{background:var(--red-soft);color:#A25445}
.pill.gray{background:#F1EEE5;color:var(--ink-2)}
.pill.line{background:#fff;border:1.5px solid var(--line);color:var(--ink-2);font-weight:400}

.li{display:flex;align-items:center;gap:13px;width:100%;background:none;border:0;padding:14px 0;text-align:left;cursor:pointer;min-height:56px;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .ic{flex:0 0 36px;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--green-soft);color:var(--green-2)}
.li .mai{flex:1;min-width:0}
.li b{font-size:14.5px;font-weight:500;display:block;line-height:1.5}
.li p{font-size:11.5px;color:var(--ink-3);margin:3px 0 0;line-height:1.6}
.li .rt{flex:0 0 auto;color:var(--ink-3);display:flex;align-items:center;gap:7px;font-size:11px}

.field{margin-bottom:18px}
.field .lb{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:7px}
.field .lb i{font-style:normal;color:var(--red);margin-left:3px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;transition:border-color .18s}
.in::placeholder{color:#B6BDB4}
.in:focus{border-color:var(--green)}
textarea.in{resize:none;line-height:1.75}
.hint{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.7}
.hint svg{flex:0 0 13px;margin-top:2px}

.risk{display:flex;gap:9px;font-size:11.5px;line-height:1.75;color:var(--ink-2);background:#FFFBF0;border:1px solid #F2E4C2;border-radius:12px;padding:11px 13px}
.risk b{font-weight:500;color:var(--ink)}
.risk svg{flex:0 0 auto;margin-top:1px}

.kv{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:400;font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
.kv span{font-size:13.5px;text-align:right;line-height:1.6}

.sw{position:relative;display:inline-block;width:44px;height:26px;flex:0 0 44px}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.sw .tr{position:absolute;inset:0;background:#DDD8C8;border-radius:999px;transition:background .2s}
.sw .kn{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.16);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sw input:checked+.tr{background:var(--green)}
.sw input:checked~.kn{transform:translateX(18px)}

.seg{display:flex;gap:6px;background:#F0EDE2;padding:4px;border-radius:999px}
.seg button{flex:1;background:none;border:0;padding:9px;font-size:13px;color:var(--ink-2);cursor:pointer;border-radius:999px;transition:background .18s,color .18s;min-height:40px}
.seg button.on{background:#fff;color:var(--green-2);font-weight:500;box-shadow:var(--sh-s)}

/* ---------- 首页 ---------- */
.hero-card{position:relative;border-radius:22px;background:var(--green-soft);padding:20px 20px 0;min-height:230px;overflow:hidden}
.hero-card .hk{font-size:10.5px;letter-spacing:.08em;color:#5D7A60;margin-bottom:12px}
.hero-card .ht{font-family:var(--round);font-size:24px;font-weight:400;line-height:1.5;letter-spacing:.03em;margin:0;color:#2C4A33;position:relative;z-index:2}
.hero-card .hs{position:absolute;right:-10px;bottom:-8px;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:0;border-radius:18px;padding:14px;min-height:112px;cursor:pointer;transition:transform .14s}
.tile:active{transform:scale(.98)}
.tile .ti{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center}
.tile .tn{display:block;font-family:var(--round);font-size:14.5px;font-weight:400;letter-spacing:.03em;line-height:1.4;margin-top:14px}
.tile .ts{display:block;font-size:10.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.tile.g{background:var(--green-soft);color:#2C4A33}
.tile.y{background:var(--yellow-soft);color:#7A5A18}
.tile.b{background:var(--blue-soft);color:#2F6480}
.tile.v{background:var(--violet-soft);color:#7A5F88}
.annocard{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:18px;padding:15px;box-shadow:var(--sh);margin-top:12px;cursor:pointer;text-align:left;border:0;width:100%}
.annocard .ad{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center;color:#A57B22}
.annocard .ab{flex:1;min-width:0}
.annocard b{font-family:var(--round);font-size:14.5px;font-weight:400;display:block;line-height:1.5}
.annocard p{font-size:11px;color:var(--ink-3);margin:4px 0 0;line-height:1.6}
.footq{font-family:var(--round);font-size:12.5px;line-height:1.9;color:var(--ink-3);text-align:center;margin:22px 0 28px}

/* ---------- 树洞 ---------- */
.postcard{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:10px;cursor:pointer}
.postcard h3{font-family:var(--round);font-size:16.5px;line-height:1.55;font-weight:400;letter-spacing:.02em;margin:0 0 8px}
.postcard .bd{font-size:13px;line-height:1.8;color:var(--ink-2);margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.postcard .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--ink-3)}
.postcard .ft .l{display:flex;align-items:center;gap:7px}
.cnt{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-3)}
.fl{display:flex;gap:11px;padding:0 0 18px}
.fl .fav{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--green-2);font-family:var(--round)}
.fl .fbd{flex:1;min-width:0}
.fl .fh{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-3);margin-bottom:6px}
.fl p{font-size:13.5px;line-height:1.85;margin:0}
.fl .sub{margin-top:9px;background:#F6F4EA;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.8;color:var(--ink-2)}

/* ---------- 资源库 ---------- */
.fd{display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:0;border-radius:16px;padding:14px;text-align:left;cursor:pointer;box-shadow:var(--sh);margin-bottom:9px}
.fd .fi{flex:0 0 38px;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:#3D7C9B}
.fd .fm{flex:1;min-width:0}
.fd b{font-size:14px;font-weight:500;display:block;line-height:1.5}
.fd p{font-size:11px;color:var(--ink-3);margin:3px 0 0;line-height:1.6}
.fd .n{flex:0 0 auto;font-size:10.5px;color:var(--ink-3);background:#F1EEE5;border-radius:999px;padding:2px 8px}

/* ---------- 活动 ---------- */
.chips{display:flex;gap:8px;padding:2px 20px 14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipx{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;color:var(--ink-2);cursor:pointer;transition:all .16s}
.chipx.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.actcard{display:block;width:100%;background:#fff;border:0;border-radius:20px;overflow:hidden;box-shadow:var(--sh);margin-bottom:12px;cursor:pointer;text-align:left;padding:0}
.cover{height:88px;position:relative;display:flex;align-items:center;justify-content:center}
.cover .dt{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);border-radius:999px;font-size:10.5px;padding:3px 9px;color:var(--ink);font-weight:500;letter-spacing:.02em}
.cover .qt{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.94);border-radius:999px;font-size:10.5px;padding:3px 9px;font-weight:500}
.ainfo{padding:13px 15px 15px}
.ainfo h4{font-family:var(--round);font-size:16px;font-weight:400;line-height:1.5;margin:0 0 6px;letter-spacing:.02em}
.ainfo p{font-size:11px;color:var(--ink-3);margin:0 0 9px;line-height:1.6}
.ainfo .m{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-2)}
.tabs{display:flex;gap:8px;padding:0 20px 16px}
.tabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--ink-2);cursor:pointer}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}

/* ---------- 档案 ---------- */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{aspect-ratio:1;border-radius:12px;position:relative;overflow:hidden}
.ph .mk{position:absolute;left:5px;bottom:5px;font-size:9px;color:#fff;letter-spacing:.02em;background:rgba(0,0,0,.28);padding:1px 5px;border-radius:999px}
.ph .nb{position:absolute;right:4px;top:4px;font-size:8px;color:#8A4B3E;background:rgba(255,255,255,.92);padding:1px 4px;border-radius:4px;max-width:calc(100% - 8px);line-height:1.5}
.wk{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:0;border-radius:14px;padding:11px;text-align:left;cursor:pointer;box-shadow:var(--sh-s);margin-bottom:8px}
.wk .th{width:42px;height:42px;flex:0 0 42px;border-radius:10px;background:var(--yellow-soft)}
.wk .wm{flex:1;min-width:0}
.wk b{font-size:13px;font-weight:500;display:block;line-height:1.5}
.wk p{font-size:10.5px;color:var(--ink-3);margin:2px 0 0}
.note{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh);margin-bottom:9px;position:relative}
.note .who{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-3);margin-bottom:8px}
.note .who b{font-weight:500;color:var(--green-2);font-family:var(--round);font-size:12px}
.note p{font-size:13.5px;line-height:1.9;color:var(--ink);margin:0}

/* ---------- 私信 ---------- */
.msg{max-width:76%;font-size:13.5px;line-height:1.75;padding:10px 13px;margin:7px 0;border-radius:16px}
.msg.them{background:#fff;box-shadow:var(--sh-s);border-bottom-left-radius:6px;margin-right:auto}
.msg.me{background:var(--green);color:#fff;border-bottom-right-radius:6px;margin-left:auto}
.mtime{font-size:10px;color:var(--ink-3);text-align:center;padding:14px 0 4px;letter-spacing:.04em}

/* ---------- 底栏 ---------- */
.tb{display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:2px}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:9px 0 8px;font-size:9.5px;letter-spacing:.05em;color:var(--ink-3);cursor:pointer}
.tb button.on{color:var(--green-2);font-weight:500}
.tb button svg{width:21px;height:21px}
.dock{padding:12px 20px 14px;background:var(--paper);border-top:1px solid var(--line)}
.dockrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.dockrow .pr{font-family:var(--round);font-size:17px;color:var(--ink)}
.dockrow .lo{font-size:11px;color:var(--ink-3)}

/* ---------- 弹层 ---------- */
.ov{position:absolute;inset:0;background:rgba(34,48,42,.36);display:flex;align-items:flex-end;z-index:50;animation:fade .18s ease}
.ov.center{align-items:center;justify-content:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--paper);border-radius:22px 22px 0 0;padding:20px 20px 24px;animation:up .26s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow:auto}
@keyframes up{from{transform:translateY(22px)}to{transform:none}}
.sheet h4{font-family:var(--round);font-size:17px;font-weight:400;margin:0 0 6px}
.sheet .sp2{font-size:11.5px;color:var(--ink-2);line-height:1.7;margin:0 0 8px}
.dialog{width:304px;background:var(--paper);border-radius:20px;padding:22px}
.dialog h4{font-family:var(--round);font-size:16.5px;font-weight:400;margin:0 0 8px}
.dialog p{font-size:12.5px;line-height:1.8;color:var(--ink-2);margin:0}
.acts{display:flex;gap:9px;margin-top:20px}
.acts .btn{flex:1}
.rrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;cursor:pointer;min-height:46px}
.rrow:last-child{border-bottom:0}
.rrow input{accent-color:var(--green);width:17px;height:17px}
.toast{position:absolute;left:50%;bottom:118px;transform:translate(-50%,8px);background:#22302A;color:#FBFAF5;font-size:12px;padding:9px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:78%;text-align:center;line-height:1.5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:56px 10px;color:var(--ink-3)}
.empty svg{margin-bottom:10px;color:#CFD6CB}
.empty p{font-size:12.5px;line-height:1.8;margin:0}
.body p{font-size:14px;line-height:1.9;margin:0 0 13px;color:var(--ink)}
.body p:last-child{margin-bottom:0}
.body .lead{font-family:var(--round);font-size:15.5px;line-height:1.95;color:var(--ink);letter-spacing:.02em}
.bul{margin:0 0 12px;padding-left:0;list-style:none;font-size:13.5px;line-height:1.9}
.bul li{display:flex;gap:9px;margin:5px 0}
.bul li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:11px;flex:0 0 6px}

@media (max-width:480px){
  .shell{padding:0;gap:0;display:block;min-height:100dvh}
  .guide{display:none}
  .device{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  .sbar{height:12px;flex-basis:12px}
  .sbar .sg,.sbar .st{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="guide" aria-label="原型导览">
    <div class="gm"><span class="gmsvg"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 19c4-3 7-2.4 8.5-4.6 1.6 2.4 4.6 3.6 8.5 4.6"/><circle cx="16.6" cy="7" r="2.6"/></svg></span><h1>无名树</h1></div>
    <p class="gcap">产品原型 · 2026 秋</p>
    <button class="gl" data-go="gate"><b>01　入群与审核</b><span>邀请码</span></button>
    <button class="gl" data-go="home"><b>02　首页与四个入口</b><span>今日</span></button>

var scEl=document.getElementById('screen');
var dockEl=document.getElementById('dockwrap');
function render(){
  var v=S.view,p=S.params||{},html='';
  switch(v){
    case 'gate':html=vGate();break;
    case 'gateOk':html=vGateOk();break;
    case 'home':html=vHome();break;
    case 'notice':html=vNotice();break;
    case 'noticeDetail':html=vNoticeDetail(p.id);break;
    case 'hollow':html=vHollow();break;
    case 'compose':html=vCompose();break;
    case 'post':html=vPost(p.id);break;
    case 'library':html=vLibrary();break;
    case 'folder':html=vFolder(p.id);break;
    case 'activities':html=vActivities();break;
    case 'activity':html=vActivity();break;
    case 'enroll':html=vEnroll();break;
    case 'enrollOk':html=vEnrollOk();break;
    case 'me':html=vMe();break;
    case 'mySignups':html=vMySignups();break;
    case 'myPosts':html=vMyPosts();break;
    case 'myWorks':html=vMyWorks();break;
    case 'settings':html=vSettings();break;
    case 'dm':html=vDm();break;
    case 'dmDetail':html=vDmDetail();break;
    default:html=vHome();
  }
  var i=html.indexOf('<!--DOCK-->');
  if(i>=0){dockEl.innerHTML=html.slice(i+11);html=html.slice(0,i);}
  else{dockEl.innerHTML='';}
  scEl.innerHTML=html;
  scEl.scrollTop=0;
}

function collect(el){
  var o={};
  ['id','tab'].forEach(function(k){
    var vv=el.getAttribute('data-'+k);
    if(vv!==null){o[k]=vv;}
  });
  return o;
}
function go(v,p){
  p=p||{};
  hist.push({v:S.view,p:S.params});
  if(hist.length>40){hist.shift();}
  S.view=v;S.params=p;
  if(v==='activity'){S.atab=p.tab||'detail';}
  render();
}
function back(){
  var h=hist.pop();
  if(h){S.view=h.v;S.params=h.p||{};}
  else{S.view='home';S.params={};}
  render();
}

/* ===== 事件 ===== */
dev.addEventListener('click',function(ev){
  var t=ev.target;
  if(t.classList&&t.classList.contains('ov')){closeOv();return;}

  var nav=t.closest('[data-nav]');
  if(nav){go(nav.getAttribute('data-nav'),collect(nav));return;}

  var bk=t.closest('[data-back]');
  if(bk){back();return;}

  var tb=t.closest('[data-tab]');
  if(tb){S.atab=tb.getAttribute('data-tab');render();return;}

  var fl=t.closest('[data-filter]');
  if(fl){var fv=fl.getAttribute('data-filter');S.filter=(fv==='全部'?'all':fv);render();return;}

  var an=t.closest('[data-anon]');
  if(an){
    var ct=document.getElementById('cp-t');if(ct){S.draft.t=ct.value;}
    var cb=document.getElementById('cp-b');if(cb){S.draft.b=cb.value;}
    S.draft.anon=an.getAttribute('data-anon')==='1';
    render();return;
  }

  var da=t.closest('[data-defanon]');
  if(da){S.anon=da.getAttribute('data-defanon')==='1';render();return;}

  var act=t.closest('[data-act]');
  if(act){handle(act);return;}
});

dev.addEventListener('change',function(ev){
  if(ev.target.id==='sw-stranger'){
    S.strangerDM=ev.target.checked;
    toast(S.strangerDM?'已允许陌生人私信':'已关闭陌生人私信');
  }
});

function handle(el){
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');

  if(a==='apply'){
    var code=document.getElementById('g-code'),nick=document.getElementById('g-nick'),agree=document.getElementById('g-agree');
    if(!code.value.trim()){toast('请填写邀请码');return;}
    if(!nick.value.trim()){toast('请填写你想用的昵称');return;}
    if(!agree.checked){toast('请先勾选社群公约');return;}
    S.nick=nick.value.trim();
    go('gateOk');return;
  }
  if(a==='pass'){go('home');toast('已通过审核，欢迎进入无名树');return;}
  if(a==='publish'){
    var pt=document.getElementById('cp-t'),pb=document.getElementById('cp-b');
    if(!pt.value.trim()){toast('给这件事一个名字');return;}
    if(!pb.value.trim()){toast('写一点此刻的感受');return;}
    var nid='p'+Date.now();
    var was=S.draft.anon;
    DATA.posts.unshift({id:nid,t:pt.value.trim(),b:pb.value.trim(),anon:was,who:was?'':S.nick,time:'刚刚',n:0,mine:true});
    DATA.replies[nid]=[];
    S.draft={t:'',b:'',anon:was};
    go('hollow');
    toast(was?'已匿名发布':'已发布');
    return;
  }
  if(a==='reply'){
    var rb=document.getElementById('rp-b');
    if(!rb||!rb.value.trim()){toast('写一句回应');return;}
    if(!DATA.replies[id]){DATA.replies[id]=[];}
    DATA.replies[id].push({who:S.nick,anon:S.anon,time:'刚刚',tx:rb.value.trim(),lv:1});
    var pp=findPost(id);
    if(pp){pp.n=pp.n+1;}
    render();
    toast(S.anon?'已匿名回应':'已回应');
    return;
  }
  if(a==='report'){openReport();return;}
  if(a==='send-report'){
    var sel=document.querySelector('input[name="rp"]:checked');
    closeOv();
    toast('已提交举报'+(sel?'：'+sel.value:''));
    return;
  }
  if(a==='close-ov'){closeOv();return;}
  if(a==='waitlist'){toast('已加入等待名单，有名额会按顺序通知');return;}
  if(a==='submit-enroll'){
    var n=document.getElementById('e-name'),ag=document.getElementById('e-age'),ph=document.getElementById('e-phone');
    if(!n.value.trim()){toast('请填写孩子姓名');return;}
    if(!ag.value.trim()){toast('请填写孩子年龄');return;}
    if(ph.value.replace(/\D/g,'').length<11){toast('请填写 11 位手机号');return;}
    S.enrolled[id]={child:n.value.trim(),age:ag.value.trim(),phone:ph.value,note:(document.getElementById('e-note')||{}).value||''};
    go('enrollOk',{id:id});return;
  }
  if(a==='jump-archive'){S.atab='archive';render();return;}
  if(a==='quiet'){openQuiet();return;}
  if(a==='save-quiet'){
    var q=document.querySelector('input[name="qq"]:checked');
    if(q){S.quiet=q.value;}
    closeOv();render();toast('免打扰时段已更新');return;
  }
  if(a==='nick'){
    overlay('<div class="ov center"><div class="dialog"><h4>修改昵称</h4>'
      +'<input class="in" id="nk" value="'+esc(S.nick)+'" style="margin-bottom:18px" autocomplete="off">'
      +'<div class="acts"><button class="btn ghost" data-act="close-ov">取消</button>'
      +'<button class="btn primary" data-act="save-nick">保存</button></div></div></div>');
    return;
  }
  if(a==='save-nick'){
    var nk=document.getElementById('nk');
    if(nk&&nk.value.trim()){S.nick=nk.value.trim();}
    closeOv();render();toast('昵称已更新');return;
  }
  if(a==='logout'){openLogout();return;}
  if(a==='do-logout'){
    closeOv();
    S.view='gate';S.params={};S.enrolled={};S.atab='detail';hist=[];
    render();toast('已退出登录');return;
  }
  if(a==='send-dm'){
    var dmb=document.getElementById('dm-b');
    if(!dmb||!dmb.value.trim()){toast('写一条消息');return;}
    DATA.dm[0].msgs.push({me:true,tx:dmb.value.trim(),time:'刚刚'});
    render();toast('已发送');return;
  }
  if(a==='search'){toast('原型里检索还没做，只能按文件夹找');return;}
  if(a==='file'){toast('原型里文件预览还没做');return;}
}

/* 导览跳转 */
Array.prototype.forEach.call(document.querySelectorAll('[data-go]'),function(g){
  g.addEventListener('click',function(e){
    e.preventDefault();
    hist=[];
    go(g.getAttribute('data-go'));
  });
});

render();
</script>
</body>
</html>
